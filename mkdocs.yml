site_name: SaberCraft Standard
site_url: https://standard.sabercraft.org/
site_description: A saber choreography standard for recording, teaching, sharing, and safely performing choreographed saber combat.
site_author: SaberCraft.org

repo_name: SaberCraft/saber-standard
repo_url: https://github.com/SaberCraftOrg/saber-standard
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/sabercraft-logo.webp
  favicon: assets/images/sabercraft-favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - toc.follow
  palette:
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - assets/stylesheets/sabercraft.css

extra_javascript:
  - assets/javascripts/hero-video.js
  - assets/javascripts/font-size.js

# mkdocs serve watches docs/ and mkdocs.yml by default; add the theme
# overrides so template edits also trigger a live reload.
watch:
  - overrides

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://sabercraft.org/
      name: SaberCraft
    - icon: fontawesome/brands/github
      link: https://github.com/SaberCraftOrg/saber-standard
      name: SaberCraft Standard on GitHub

copyright: Copyright &copy; Lumina Federation LLC. SaberCraft.org is the founding school/community of the SaberCraft Standard.

nav:
  - Home: index.md
  - Learn:
      - Start Here / Beginner Path: start-here.md
      - Notation Overview: notation/index.md
      - Targets: notation/targets.md
      - Attacks: notation/attacks.md
      - Parries: notation/parries.md
      - Legend: notation/legend.md
      - Glossary: glossary.md
      - The Standard: standard.md
      - FAQ: faq.md
      - Downloads: downloads.md
  - Choreographies:
      - Movement Library: core/index.md
      - Core Library: core/core-library.md
      - Extended Library: core/extended-library.md
      - Community Library: core/community-library.md
      - CM Catalog: core/cm-catalog.md
  - Games:
      - Overview: games/index.md
      - Rules: games/rules.md
      - Advanced Rules: games/advanced-rules.md
  - Advancement: advancement/index.md
  - Adopt & Contribute:
      - For Schools: for-schools.md
      - Governance: versioning-and-governance.md
      - Contribute: contributing-and-submissions.md
      - Licensing: licensing.md
